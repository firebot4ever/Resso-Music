name: Android Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

    - name: Setup Keystore if available
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > Resso-release.jks
          {
            echo "storeFile=Resso-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APKs
      run: ./gradlew :app:assembleProdDebug :app:assembleProdRelease --stacktrace || ./gradlew :app:assembleProdDebug

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Resso-APKs
        path: |
          app/build/outputs/apk/prod/**/*.apk

    - name: Prepare Release APKs
      run: |
        mkdir -p release-apks
        TAG_NAME="${{ github.ref_name }}"
        [ -z "$TAG_NAME" ] && TAG_NAME="latest"
        find app/build/outputs/apk/prod -name "*.apk" -type f | while read -r f; do
          fname=$(basename "$f")
          if [[ "$fname" == *"-unsigned.apk"* ]]; then
            continue
          fi
          if [[ "$fname" == *"universal"* ]]; then
            cp "$f" "release-apks/Resso-${TAG_NAME}.apk"
          elif [[ "$fname" == *"arm64-v8a"* ]]; then
            cp "$f" "release-apks/Resso-${TAG_NAME}_arm64-v8a.apk"
          elif [[ "$fname" == *"armeabi-v7a"* ]]; then
            cp "$f" "release-apks/Resso-${TAG_NAME}_armeabi-v7a.apk"
          elif [[ "$fname" == *"x86_64"* ]]; then
            cp "$f" "release-apks/Resso-${TAG_NAME}_x86_64.apk"
          fi
          cp "$f" "release-apks/$fname"
        done
        ls -la release-apks

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        files: release-apks/*.apk
        generate_release_notes: false
        body: |
          ### What's New:
          - Native Spotify Home Screen: If logged in with Spotify, Home transforms into a full Spotify home view (2-column Quick Access grid, Liked Songs, Made For You mixes with Spotify badge, and Your Playlists)
          - Spotify Profile Photo: Real-time profile photo display in the top bar and account screen with automatic retry fetching
          - Discord Rich Presence: Replaced missing asset dice with official Resso app logo on player card, and removed buttons for a sleek look
          - Full Multi-Color App Theme Customizer: Choose from Crimson Red, Spotify Green, Neon Purple, Electric Blue, Sunset Orange, Hot Pink, Aqua Teal, Amber Gold, or Material You Dynamic wallpaper theming!
          - Home Screen Floating Dynamic Island (Camera punch hole & expanded playback controls)
          - Permanent Keystore Integration for clean in-app updates
